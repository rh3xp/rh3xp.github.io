<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>rh3xp</title>

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg-color: #12121b;
                --card-bg: #1e1e2e;
                --text-primary: #e2e2f0;
                --text-secondary: #a5a5ba;
                --accent-color: #a799ff;
                --border-color: #2e2e48;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                --radius: 12px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Reenie Beanie", cursive;
            }

            body {
                background: var(--bg-color);
                color: var(--text-primary);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                line-height: 1.5;
            }

            /* Navbar */

            .navbar {
                background: rgba(30, 30, 46, 0.85);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 14px 32px;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .logo {
                text-decoration: none;
                color: var(--accent-color);
                font-size: 3.2rem;
                transition: 0.2s ease;
            }

            .logo:hover {
                color: white;
            }

            .nav-links {
                display: flex;
                list-style: none;
                gap: 30px;
            }

            .nav-links a {
                text-decoration: none;
                color: var(--text-secondary);
                font-size: 2.3rem;
                transition: 0.2s ease;
            }

            .nav-links a:hover {
                color: white;
                transform: rotate(-3deg);
            }

            /* Main */

            .main-content {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
            }

            .container {
                width: 100%;
                max-width: 700px;
            }

            .card {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: var(--radius);
                padding: 60px;
                text-align: center;
                box-shadow: var(--shadow);
            }

            h1 {
                font-size: 5rem;
                color: white;
                margin-bottom: 10px;
                font-weight: normal;
            }

            p {
                font-size: 2rem;
                color: var(--text-secondary);
                margin-bottom: 40px;
            }

            .btn {
                display: inline-block;
                text-decoration: none;
                background: var(--accent-color);
                color: #12121b;
                border: none;
                border-radius: 10px;
                padding: 12px 36px;
                cursor: pointer;
                font-size: 2rem;
                transition: 0.2s ease;
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(167, 153, 255, 0.4);
            }

            @media (max-width: 768px) {
                .navbar {
                    flex-direction: column;
                    gap: 15px;
                }

                .nav-links {
                    gap: 20px;
                    flex-wrap: wrap;
                    justify-content: center;
                }

                .logo {
                    font-size: 2.8rem;
                }

                .nav-links a {
                    font-size: 2rem;
                }

                h1 {
                    font-size: 4rem;
                }

                p {
                    font-size: 1.8rem;
                }

                .card {
                    padding: 40px 25px;
                }
            }
        </style>
    </head>

    <body>
        <nav class="navbar">
            <a href="index.html" class="logo">rh3xp</a>

            <ul class="nav-links">
                <li><a href="blog.html">blog</a></li>
                <li><a href="#">experience</a></li>
                <li><a href="#">projects</a></li>
                <li><a href="#">about</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="container">
                <div class="card">
                    <h1>rh3xp</h1>
                    <p>rabbit hole explorer</p>

                    <button class="btn">enter</button>
                </div>
            </div>
        </main>
    </body>
</html>
